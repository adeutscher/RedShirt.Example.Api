services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - 4566:4566
      - 8883:8883
    environment:
      MINISTACK_HOST: ministack
    networks:
      default:
        aliases:
          # Must match `aws iot describe-endpoint` (account-specific prefix persists in MiniStack state).
          - f7b11509f4d675-ats.iot.us-east-1.ministack

  redis:
    image: redis:latest
    ports:
      - '6379:6379'

  mariadb:
    image: mariadb:latest
    ports:
      - '3306:3306'
    environment:
      MARIADB_ROOT_PASSWORD: ${LOCAL_SQL_PASSWORD}
      MARIADB_DATABASE: example
      MARIADB_USER: example-user
      MARIADB_PASSWORD: example-password
    volumes:
      - ./data/mariadb-data:/var/lib/mysql

  # Mocks the Foo HTTP API consumed by Connectors.Foo.Implementation (POST/GET /api/foo).
  # Stubs live under ./wiremock/foo/mappings. Admin UI: http://localhost:9100/__admin/
  wiremock-foo:
    image: wiremock/wiremock:3.13.1
    ports:
      - "9100:8080"
    volumes:
      - ./wiremock/foo:/home/wiremock
    entrypoint:
      - /docker-entrypoint.sh
      - --global-response-templating
      - --verbose

  # Mocks Bar OAuth token + Bar HTTP API (POST /oauth/token, POST/GET /api/bar).
  # Stubs live under ./wiremock/bar/mappings. Admin UI: http://localhost:9101/__admin/
  wiremock-bar:
    image: wiremock/wiremock:3.13.1
    ports:
      - "9101:8080"
    volumes:
      - ./wiremock/bar:/home/wiremock
    entrypoint:
      - /docker-entrypoint.sh
      - --global-response-templating
      - --verbose

  # Local OpenID Provider for API JWT authentication (admin console: http://localhost:9080/)
  # Realm file: ./keycloak/realm-example.json (realm "example", roles admin / developer / analyst / billing).
  # Import --override on each start so seeded users/roles always match the JSON.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/keycloak/bin/kc.sh import --file /opt/keycloak/data/import/realm-example.json --override true
        exec /opt/keycloak/bin/kc.sh start-dev
    ports:
      - "9080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Advertise localhost issuer while still serving the API container on the Docker network.
      KC_HOSTNAME: http://localhost:9080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/realm-example.json:/opt/keycloak/data/import/realm-example.json:ro

  api:
    build:
      context: ../..
      args:
        TESTS_ENABLE: "${TESTS_ENABLE-1}"
    depends_on:
      - ministack
      - redis
      - mariadb
      - wiremock-foo
      - wiremock-bar
      - keycloak
    ports:
      - "9000:8080"
    environment:
      # AspNetCore
      ##
      ASPNETCORE_ENVIRONMENT: Development # Enable swagger
      ASPNETCORE_URLS: http://*:8080
      API__PATH_BASE: null
      # AWS Settings
      ##
      AWS_SERVICE_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: foo
      AWS_SECRET_ACCESS_KEY: bar
      AWS_REGION: us-east-1
      # Authentication (Keycloak JWT bearer)
      ##
      AUTHENTICATION__DISABLE_AUTHENTICATION: "${AUTHENTICATION__DISABLE_AUTHENTICATION-false}"
      AUTHENTICATION__AUTHORITY: "${AUTHENTICATION__AUTHORITY-http://localhost:9080/realms/example}"
      AUTHENTICATION__METADATA_ADDRESS: "${AUTHENTICATION__METADATA_ADDRESS-http://keycloak:8080/realms/example/.well-known/openid-configuration}"
      AUTHENTICATION__AUDIENCE: "${AUTHENTICATION__AUDIENCE-example-api}"
      AUTHENTICATION__REQUIRE_HTTPS_METADATA: "${AUTHENTICATION__REQUIRE_HTTPS_METADATA-false}"
      # General
      ##
      LOGGING__LOG_LEVEL__DEFAULT: Information
      # Core Configuration
      ##
      CORE__IDEMPOTENCY__IDEMPOTENCY_TRACKING_TIME_MINUTES: 3
      # Secrets
      ##
      COMMON__SECRETS__CACHE__FORCE_COOLDOWN_SECONDS: "${COMMON__SECRETS__CACHE__FORCE_COOLDOWN_SECONDS-1}"
      # Azure Key Vault (when AddSecretManagerAzureKeyVault is used instead of SSM)
      COMMON__SECRETS__AZURE_KEY_VAULT__KEY_VAULT_URL: "${COMMON__SECRETS__AZURE_KEY_VAULT__KEY_VAULT_URL-https://localhost:8443/}"
      COMMON__SECRETS__AZURE_KEY_VAULT__GENERATE_LOCAL_TESTING_TOKEN: true
      # Docker Secrets
      # Set alternate secret path (default on null: /run/secrets)
      COMMON__SECRETS__DOCKER__DIRECTORY: null
      # Distributed (Redis cache / locks)
      ##
      COMMON__DISTRIBUTED__REDIS__CONNECTION_STRING_PATH: "${COMMON__DISTRIBUTED__REDIS__CONNECTION_STRING_PATH-/redis/connection-string}"
      COMMON__DISTRIBUTED__LOCKS__TIMEOUT_SECONDS: "${COMMON__DISTRIBUTED__LOCKS__TIMEOUT_SECONDS-10}"
      COMMON__DISTRIBUTED__SAFETY__DISGRACE_PERIOD_SECONDS: "${COMMON__DISTRIBUTED__SAFETY__DISGRACE_PERIOD_SECONDS-30}"
      # Rate Limiting
      ##
      RATE_LIMITING__DISABLE_RATE_LIMITING: false
      RATE_LIMITING__USE_REDIS: true
      RATE_LIMITING__DEFAULT_POLICY_NAME: "default"
      RATE_LIMITING__POLICIES__DEFAULT__NAME: "default"
      RATE_LIMITING__POLICIES__DEFAULT__REDIS_KEY_PREFIX: "default"
      RATE_LIMITING__POLICIES__DEFAULT__WINDOW_PERMIT_LIMIT: 60
      RATE_LIMITING__POLICIES__DEFAULT__LIMIT_WINDOW_MINUTES: 1
      RATE_LIMITING__POLICIES__DEFAULT__FAIL_CLOSED: false
      RATE_LIMITING__POLICIES__EXAMPLE__NAME: "example"
      RATE_LIMITING__POLICIES__EXAMPLE__REDIS_KEY_PREFIX: "example"
      RATE_LIMITING__POLICIES__EXAMPLE__WINDOW_PERMIT_LIMIT: 30
      RATE_LIMITING__POLICIES__EXAMPLE__LIMIT_WINDOW_MINUTES: 1
      RATE_LIMITING__POLICIES__EXAMPLE__FAIL_CLOSED: false
      RATE_LIMITING__POLICIES__UPLOADS__NAME: "uploads"
      RATE_LIMITING__POLICIES__UPLOADS__REDIS_KEY_PREFIX: "uploads"
      RATE_LIMITING__POLICIES__UPLOADS__WINDOW_PERMIT_LIMIT: 5
      RATE_LIMITING__POLICIES__UPLOADS__LIMIT_WINDOW_MINUTES: 1
      RATE_LIMITING__POLICIES__UPLOADS__FAIL_CLOSED: false
      # App-specific variables
      STORAGE__EXAMPLE_ITEM__TABLE_NAME: example
      # Database (MariaDB): path to SSM secret holding the MySql.Data connection string
      ##
      CONNECTION_STRINGS__PRIMARY: "/mysql/connection-string"
      # Foo connector (external HTTP dependency)
      ##
      CONNECTORS__FOO__BASE_URL: "${CONNECTORS__FOO__BASE_URL-http://wiremock-foo:8080}"
      CONNECTORS__FOO__API_KEY_PATH: "${CONNECTORS__FOO__API_KEY_PATH-/foo/api-key}"
      CONNECTORS__FOO__API_KEY_REFRESH_COOLDOWN_SECONDS: "${CONNECTORS__FOO__API_KEY_REFRESH_COOLDOWN_SECONDS-60}"
      CONNECTORS__FOO__RETRY_COUNT: "${CONNECTORS__FOO__RETRY_COUNT-3}"
      # Bar connector (external HTTP dependency + OAuth client credentials)
      ##
      CONNECTORS__BAR__BASE_URL: "${CONNECTORS__BAR__BASE_URL-http://wiremock-bar:8080}"
      CONNECTORS__BAR__TOKEN_URL: "${CONNECTORS__BAR__TOKEN_URL-http://wiremock-bar:8080/oauth/token}"
      CONNECTORS__BAR__CLIENT_ID_PATH: "${CONNECTORS__BAR__CLIENT_ID_PATH-/bar/oauth/client-id}"
      CONNECTORS__BAR__CLIENT_SECRET_PATH: "${CONNECTORS__BAR__CLIENT_SECRET_PATH-/bar/oauth/client-secret}"
      CONNECTORS__BAR__SCOPE_LABEL: "${CONNECTORS__BAR__SCOPE_LABEL-audience}"
      CONNECTORS__BAR__SCOPE_VALUE: "${CONNECTORS__BAR__SCOPE_VALUE-https://bar.local/api}"
      CONNECTORS__BAR__TOKEN_REFRESH_COOLDOWN_SECONDS: "${CONNECTORS__BAR__TOKEN_REFRESH_COOLDOWN_SECONDS-30}"
      CONNECTORS__BAR__RETRY_COUNT: "${CONNECTORS__BAR__RETRY_COUNT-3}"
      CONNECTORS__BAR__FALLBACK_JWT_EXPIRY_TIME_MINUTES: "${CONNECTORS__BAR__FALLBACK_JWT_EXPIRY_TIME_MINUTES-30}"
      # Uploads (S3 blob storage + event-sourced metadata)
      ##
      UPLOADS__BUCKET_UNVERIFIED_ITEMS: "${UPLOADS__BUCKET_UNVERIFIED_ITEMS-unverified-uploads}"
      UPLOADS__BUCKET_VERIFIED_ITEMS: "${UPLOADS__BUCKET_VERIFIED_ITEMS-verified-uploads}"
      UPLOADS__MAX_UPLOAD_SIZE_BYTES: "${UPLOADS__MAX_UPLOAD_SIZE_BYTES-}"
      UPLOADS__PRESIGNED_URL_LIFETIME_MINUTES: "${UPLOADS__PRESIGNED_URL_LIFETIME_MINUTES-15}"
      # Client events (MiniStack IoT MQTT broker)
      ##
      CLIENT_EVENTS__MQTT__RESOLVE_BROKER_ADDRESS_EXTERNALLY: "${CLIENT_EVENTS__MQTT__RESOLVE_BROKER_ADDRESS_EXTERNALLY-true}"
      CLIENT_EVENTS__MQTT__AWS__BROKER_CONNECT_HOST: "${CLIENT_EVENTS__MQTT__AWS__BROKER_CONNECT_HOST-}"
      CLIENT_EVENTS__MQTT__BROKER_URL: "${CLIENT_EVENTS__MQTT__BROKER_URL-}"
      CLIENT_EVENTS__MQTT__CLIENT_ID_PREFIX: "${CLIENT_EVENTS__MQTT__CLIENT_ID_PREFIX-RedShirt.Example.Api}"
      # Set specific protocol version
      CLIENT_EVENTS__MQTT__PROTOCOL_VERSION: "${CLIENT_EVENTS__MQTT__PROTOCOL_VERSION-V311}"
      CLIENT_EVENTS__MQTT__USERNAME_SECRET_PATH: null
      CLIENT_EVENTS__MQTT__PASSWORD_SECRET_PATH: null
      CLIENT_EVENTS__MQTT__RETRY_COUNT: "${CLIENT_EVENTS__MQTT__RETRY_COUNT-3}"
