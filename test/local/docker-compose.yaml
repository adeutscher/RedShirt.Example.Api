services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - 4566:4566

  redis:
    image: redis:latest
    ports:
      - '6379:6379'

  api:
    build:
      context: ../..
      args:
        TESTS_ENABLE: "${TESTS_ENABLE-1}"
    depends_on:
      - ministack
      - redis
    ports:
      - "9000:8080"
    environment:
      # AspNetCore
      ##
      ASPNETCORE_ENVIRONMENT: Development # Enable swagger
      ASPNETCORE_URLS: http://*:8080
      # AWS Settings
      ##
      AWS_SERVICE_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: foo
      AWS_SECRET_ACCESS_KEY: bar
      AWS_REGION: us-east-1
      # General
      ##
      LOGGING__LOG_LEVEL__DEFAULT: Information
      # Core Configuration
      ##
      CORE__IDEMPOTENCY__IDEMPOTENCY_TRACKING_TIME_MINUTES: 3
      # Secrets
      ##
      COMMON__SECRETS__CACHE__FORCE_COOLDOWN_SECONDS: "${COMMON__SECRETS__CACHE__FORCE_COOLDOWN_SECONDS-30}"
      # Distributed (Redis cache / locks)
      ##
      COMMON__DISTRIBUTED__REDIS__CONNECTION_STRING_PATH: "${COMMON__DISTRIBUTED__REDIS__CONNECTION_STRING_PATH-/redis/connection-string}"
      COMMON__DISTRIBUTED__LOCKS__TIMEOUT_SECONDS: "${COMMON__DISTRIBUTED__LOCKS__TIMEOUT_SECONDS-10}"
      COMMON__DISTRIBUTED__SAFETY__DISGRACE_PERIOD_SECONDS: "${COMMON__DISTRIBUTED__SAFETY__DISGRACE_PERIOD_SECONDS-30}"
      # Rate Limiting
      ##
      RATE_LIMITING__DISABLE_RATE_LIMITING: false
      RATE_LIMITING__USE_REDIS: true
      # RATE_LIMITING__DEFAULT_POLICY_NAME: null
      RATE_LIMITING__POLICIES__EXAMPLE__NAME: "example"
      RATE_LIMITING__POLICIES__EXAMPLE__REDIS_KEY_PREFIX: "example"
      RATE_LIMITING__POLICIES__EXAMPLE__WINDOW_PERMIT_LIMIT: 30
      RATE_LIMITING__POLICIES__EXAMPLE__LIMIT_WINDOW_MINUTES: 1
      RATE_LIMITING__POLICIES__EXAMPLE__FAIL_CLOSED: false
      # App-specific variables
      STORAGE__EXAMPLE_ITEM__TABLE_NAME: example
